[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waechter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8,<4",
    "python-dotenv>=1.0,<2",
    "python-whois>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
